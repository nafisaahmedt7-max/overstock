<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">OVERSTOCK demo size chart</title>
  <desc id="description">A clearly labeled sample garment size chart for preview testing. Measurements are illustrative only.</desc>
  <rect width="1200" height="900" fill="#f7f7f4"/>
  <g fill="#171715" font-family="Arial, Helvetica, sans-serif">
    <text x="84" y="88" font-size="18" letter-spacing="4">OVERSTOCK / PRODUCT INFORMATION</text>
    <text x="84" y="190" font-size="54" font-weight="700" letter-spacing="1">DEMO SIZE CHART</text>
    <text x="84" y="236" font-size="22" fill="#55554f">SAMPLE GARMENT MEASUREMENTS · CENTIMETRES</text>
  </g>
  <rect x="84" y="290" width="1032" height="72" fill="#171715"/>
  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1">
    <text x="112" y="334">MEASUREMENT</text>
    <text x="510" y="334" text-anchor="middle">S</text>
    <text x="620" y="334" text-anchor="middle">M</text>
    <text x="730" y="334" text-anchor="middle">L</text>
    <text x="840" y="334" text-anchor="middle">XL</text>
    <text x="950" y="334" text-anchor="middle">XXL</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#171715">
    <rect x="84" y="362" width="1032" height="88" fill="#fff"/>
    <text x="112" y="416">CHEST WIDTH</text><text x="510" y="416" text-anchor="middle">54</text><text x="620" y="416" text-anchor="middle">57</text><text x="730" y="416" text-anchor="middle">60</text><text x="840" y="416" text-anchor="middle">63</text><text x="950" y="416" text-anchor="middle">66</text>
    <rect x="84" y="450" width="1032" height="88" fill="#efefeb"/>
    <text x="112" y="504">BODY LENGTH</text><text x="510" y="504" text-anchor="middle">68</text><text x="620" y="504" text-anchor="middle">70</text><text x="730" y="504" text-anchor="middle">72</text><text x="840" y="504" text-anchor="middle">74</text><text x="950" y="504" text-anchor="middle">76</text>
    <rect x="84" y="538" width="1032" height="88" fill="#fff"/>
    <text x="112" y="592">SHOULDER</text><text x="510" y="592" text-anchor="middle">48</text><text x="620" y="592" text-anchor="middle">50</text><text x="730" y="592" text-anchor="middle">52</text><text x="840" y="592" text-anchor="middle">54</text><text x="950" y="592" text-anchor="middle">56</text>
    <rect x="84" y="626" width="1032" height="88" fill="#efefeb"/>
    <text x="112" y="680">SLEEVE LENGTH</text><text x="510" y="680" text-anchor="middle">61</text><text x="620" y="680" text-anchor="middle">62</text><text x="730" y="680" text-anchor="middle">63</text><text x="840" y="680" text-anchor="middle">64</text><text x="950" y="680" text-anchor="middle">65</text>
  </g>
  <g fill="#55554f" font-family="Arial, Helvetica, sans-serif">
    <text x="84" y="780" font-size="18" font-weight="700" letter-spacing="1">PREVIEW TEST ASSET</text>
    <text x="84" y="816" font-size="17">Illustrative values only. Replace with measurements for the specific product before publication.</text>
    <text x="1116" y="852" text-anchor="end" font-size="15" letter-spacing="2">OVERSTOCK · SIZE GUIDE</text>
  </g>
</svg>